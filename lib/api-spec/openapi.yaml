openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Packaging Compliance AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Compliance command center metrics
  - name: packages
    description: Packaging review records
  - name: regulations
    description: Regulatory knowledge base
  - name: suppliers
    description: Suppliers and vendors
  - name: audit
    description: Audit history
  - name: notifications
    description: Notification center
  - name: reports
    description: Compliance reports
  - name: admin
    description: Admin and users
  - name: ai
    description: AI model provider configuration
  - name: violations
    description: Cross-package compliance violations and AI recommendations
  - name: language
    description: AI Language Review Engine — spelling, grammar, context, regulatory, marketing claims, and brand language
  - name: document-ai
    description: Google Document AI extraction — OCR text, page coordinates, and packaging component detection
  - name: reviews
    description: Review assignment, load balancing, SLA/workload reporting, and escalation
  - name: operations
    description: Operations console — teams, roles, queue performance, and system health
  - name: policies
    description: Internal Policy & Standards Engine — company-specific standards that participate in reviews with equal authority to government regulations
  - name: sop-documents
    description: SOP document management — uploaded standard-operating-procedure files with version history and comparison
  - name: ai-usage
    description: AI usage analytics & cost dashboard — per-request spend, volume, model/tier mix, escalation frequency, and success/error rates
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Compliance command center KPIs
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/trends:
    get:
      operationId: getComplianceTrends
      tags: [dashboard]
      summary: Compliance, risk and review-volume trends over time
      responses:
        "200":
          description: Trend points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  /dashboard/violation-distribution:
    get:
      operationId: getViolationDistribution
      tags: [dashboard]
      summary: Violations grouped by compliance engine
      responses:
        "200":
          description: Violation distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributionItem"

  /dashboard/category-distribution:
    get:
      operationId: getCategoryDistribution
      tags: [dashboard]
      summary: Packages grouped by product category
      responses:
        "200":
          description: Category distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributionItem"

  /dashboard/vendor-performance:
    get:
      operationId: getVendorPerformance
      tags: [dashboard]
      summary: Vendor compliance performance
      responses:
        "200":
          description: Vendor performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorPerformanceItem"

  /ai-usage/analytics:
    get:
      operationId: getAiUsageAnalytics
      tags: [ai-usage]
      summary: AI usage & cost analytics for a date range
      description: Org-scoped AI spend, volume, model/tier mix, per-operation breakdown, escalation frequency and success/error rates over a date range (defaults to the last 30 days).
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Inclusive start day (YYYY-MM-DD). Defaults to 29 days before `to`.
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Inclusive end day (YYYY-MM-DD). Defaults to today (UTC).
      responses:
        "200":
          description: AI usage analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsageAnalytics"

  /ai-usage/export:
    get:
      operationId: exportAiUsage
      tags: [ai-usage]
      summary: Export AI usage request-level rows as CSV
      description: Org-scoped, date-filtered CSV of individual AI requests for the selected range (same scope, permission gate, and window as the on-screen dashboard). Streamed page-by-page server-side so large ranges do not buffer the whole ledger in memory. Suitable for finance/ops reconciliation.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Inclusive start day (YYYY-MM-DD). Defaults to 29 days before `to`.
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Inclusive end day (YYYY-MM-DD). Defaults to today (UTC).
      responses:
        "200":
          description: CSV file of AI usage rows
          content:
            text/csv:
              schema:
                type: string

  /ai-usage/requests:
    get:
      operationId: listAiUsageRequests
      tags: [ai-usage]
      summary: Recent AI requests (paginated)
      description: Org-scoped, date-filtered list of individual AI requests, newest first. Bounded via limit/offset.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Inclusive start day (YYYY-MM-DD).
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Inclusive end day (YYYY-MM-DD).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max rows to return (clamped server-side).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: AI request rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiUsageRequest"

  /ai-usage/health:
    get:
      operationId: getAiUsageHealth
      tags: [ai-usage]
      summary: AI usage telemetry write-health signal
      description: Fleet-wide health of the fire-and-forget AI usage logging pipeline. Because usage writes never block the AI response, a failing write is otherwise invisible and the cost/usage figures can silently under-report. Each API instance heartbeats its write-health into a shared store, and this endpoint aggregates across all recently-seen instances so an admin hitting a healthy process still sees when another instance is dropping writes. Use it to tell "cost looks low because logging is failing" apart from "usage genuinely dropped".
      responses:
        "200":
          description: Telemetry write-health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsageHealth"

  /violations:
    get:
      operationId: listViolations
      tags: [violations]
      summary: List compliance violations across all packages with filters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: engine
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: vendor
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: resolved
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of violations with package context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ViolationWithPackage"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List packaging reviews with optional filters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: risk
          in: query
          required: false
          schema:
            type: string
        - name: engine
          in: query
          required: false
          schema:
            type: string
        - name: vendor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
    post:
      operationId: createPackage
      tags: [packages]
      summary: Upload a package for review (auto-runs AI analysis when artwork text is provided)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Created package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "409":
          description: A package with the same SKU or UPC already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateConflict"

  /packages/duplicates:
    get:
      operationId: checkPackageDuplicates
      tags: [packages]
      summary: Check for existing packages with the same SKU or UPC
      parameters:
        - name: sku
          in: query
          required: false
          schema:
            type: string
        - name: upc
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePackageCheck"

  /ocr:
    post:
      operationId: extractArtworkText
      tags: [packages]
      summary: OCR an uploaded packaging artwork image into plain text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrExtractInput"
      responses:
        "200":
          description: Extracted artwork text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrExtractResult"
        "400":
          description: Invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /ocr/fields:
    post:
      operationId: extractArtworkFields
      tags: [packages]
      summary: >-
        Extract structured package metadata (product name, brand, UPC, net
        weight, country) from an uploaded packaging artwork image. Best-effort:
        unreadable fields come back empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrExtractInput"
      responses:
        "200":
          description: Extracted package fields (empty strings for unread fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageFieldsResult"
        "400":
          description: Invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}:
    get:
      operationId: getPackage
      tags: [packages]
      summary: Get a package with full compliance intelligence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updatePackage
      tags: [packages]
      summary: Update package status or workflow state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageUpdate"
      responses:
        "200":
          description: Updated package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePackage
      tags: [packages]
      summary: Delete a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/analyze:
    post:
      operationId: analyzePackage
      tags: [packages]
      summary: Run (or re-run) the AI compliance analysis pipeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analyzed package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /document-ai/status:
    get:
      operationId: getDocumentAiStatus
      tags: [document-ai]
      summary: Google Document AI configuration status
      responses:
        "200":
          description: Document AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAiStatus"

  /packages/{id}/extraction:
    get:
      operationId: getPackageExtraction
      tags: [document-ai]
      summary: Latest cached Document AI extraction for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Latest extraction or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DocumentExtraction"
                  - type: "null"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/extractions:
    get:
      operationId: listPackageExtractions
      tags: [document-ai]
      summary: Document AI extraction history for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Extraction history (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentExtraction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/reprocess:
    post:
      operationId: reprocessPackage
      tags: [document-ai]
      summary: Re-run Document AI extraction and analysis for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reprocess result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocessResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Document AI not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/copilot:
    post:
      operationId: askCopilot
      tags: [packages]
      summary: Ask the AI compliance copilot a question about this package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotInput"
      responses:
        "200":
          description: Copilot answer with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotAnswer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/audit:
    get:
      operationId: getPackageAudit
      tags: [packages]
      summary: Review history for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

  /packages/{id}/report:
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a compliance report for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/bulk-analyze:
    post:
      operationId: bulkAnalyze
      tags: [packages]
      summary: Run compliance analysis across many packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAnalyzeInput"
      responses:
        "200":
          description: Bulk analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAnalyzeResult"

  /packages/{id}/language-review:
    get:
      operationId: getLanguageReview
      tags: [language]
      summary: Get the latest AI language review for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Language review detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageReviewDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: runLanguageReview
      tags: [language]
      summary: Run (or re-run) the AI Language Review Engine for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Language review detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageReviewDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/claims:
    get:
      operationId: getClaimsAnalysis
      tags: [claims]
      summary: Get the latest AI claims compliance analysis for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Claims analysis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsAnalysisDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: runClaimsAnalysis
      tags: [claims]
      summary: Run (or re-run) the AI Claims Compliance Engine for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Claims analysis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsAnalysisDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/bulk-language-review:
    post:
      operationId: bulkLanguageReview
      tags: [language]
      summary: Run the AI Language Review Engine across many packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLanguageReviewInput"
      responses:
        "200":
          description: Bulk language review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLanguageReviewResult"

  /language-findings:
    get:
      operationId: listLanguageFindings
      tags: [language]
      summary: List AI language findings across packages with filters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: issueType
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: minScore
          in: query
          required: false
          schema:
            type: integer
        - name: maxScore
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of language findings with package context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageFindingWithPackage"

  /language-findings/{id}:
    patch:
      operationId: updateLanguageFinding
      tags: [language]
      summary: Update a language finding's status or approved fix
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLanguageFindingInput"
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageFinding"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /language-reviews:
    get:
      operationId: listLanguageReviews
      tags: [language]
      summary: Per-package language review summaries for bulk review
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Language review summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageReviewSummary"

  /dashboard/language-quality:
    get:
      operationId: getLanguageQuality
      tags: [language]
      summary: Aggregate language quality metrics for the dashboard widget
      responses:
        "200":
          description: Language quality stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageQualityStats"

  /fda/recalls:
    get:
      operationId: listFdaRecalls
      tags: [regulations]
      summary: Search live FDA recall & enforcement actions (openFDA)
      parameters:
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [food, drug, device]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Matching FDA recalls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FdaRecallResponse"

  /fda/status:
    get:
      operationId: getFdaStatus
      tags: [regulations]
      summary: FDA integration status & category-to-source catalog (admin)
      responses:
        "200":
          description: FDA integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FdaStatus"

  /fda/intelligence:
    get:
      operationId: getFdaIntelligence
      tags: [regulations]
      summary: Assemble applicable FDA regulatory intelligence for a package
      parameters:
        - name: packageId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: FDA intelligence for the package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FdaIntelligence"

  /ecfr/status:
    get:
      operationId: getEcfrStatus
      tags: [regulations]
      summary: eCFR regulatory data sync status & curated parts catalog (admin)
      responses:
        "200":
          description: eCFR integration status
          content:
            application/json:
              schema:
