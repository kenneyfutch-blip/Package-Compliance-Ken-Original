components:
  schemas:
    Policy:
      type: object
      required:
        [
          id,
          name,
          category,
          status,
          defaultSeverity,
          tags,
          version,
          extractionStatus,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        policyType:
          type: string
          nullable: true
        category:
          type: string
        department:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        status:
          type: string
        defaultSeverity:
          type: string
        tags:
          type: array
          items:
            type: string
        effectiveDate:
          type: string
          nullable: true
        expirationDate:
          type: string
          nullable: true
        version:
          type: integer
        documentUrl:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        extractedText:
          type: string
          nullable: true
        extractionStatus:
          type: string
        extractionEngine:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string

    PolicyInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        category:
          type: string
