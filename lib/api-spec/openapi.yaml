openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Packaging Compliance AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Compliance command center metrics
  - name: packages
    description: Packaging review records
  - name: regulations
    description: Regulatory knowledge base
  - name: suppliers
    description: Suppliers and vendors
  - name: audit
    description: Audit history
  - name: notifications
    description: Notification center
  - name: reports
    description: Compliance reports
  - name: admin
    description: Admin and users
  - name: ai
    description: AI model provider configuration
  - name: violations
    description: Cross-package compliance violations and AI recommendations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Compliance command center KPIs
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/trends:
    get:
      operationId: getComplianceTrends
      tags: [dashboard]
      summary: Compliance, risk and review-volume trends over time
      responses:
        "200":
          description: Trend points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  /dashboard/violation-distribution:
    get:
      operationId: getViolationDistribution
      tags: [dashboard]
      summary: Violations grouped by compliance engine
      responses:
        "200":
          description: Violation distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributionItem"

  /dashboard/category-distribution:
    get:
      operationId: getCategoryDistribution
      tags: [dashboard]
      summary: Packages grouped by product category
      responses:
        "200":
          description: Category distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributionItem"

  /dashboard/vendor-performance:
    get:
      operationId: getVendorPerformance
      tags: [dashboard]
      summary: Vendor compliance performance
      responses:
        "200":
          description: Vendor performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorPerformanceItem"

  /violations:
    get:
      operationId: listViolations
      tags: [violations]
      summary: List compliance violations across all packages with filters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: engine
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: vendor
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: resolved
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of violations with package context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ViolationWithPackage"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List packaging reviews with optional filters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: risk
          in: query
          required: false
          schema:
            type: string
        - name: engine
          in: query
          required: false
          schema:
            type: string
        - name: vendor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
    post:
      operationId: createPackage
      tags: [packages]
      summary: Upload a package for review (auto-runs AI analysis when artwork text is provided)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Created package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"

  /ocr:
    post:
      operationId: extractArtworkText
      tags: [packages]
      summary: OCR an uploaded packaging artwork image into plain text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrExtractInput"
      responses:
        "200":
          description: Extracted artwork text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrExtractResult"
        "400":
          description: Invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for direct file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/proofs:
    get:
      operationId: listProofs
      tags: [proofs]
      summary: List proof versions for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proofs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proof"
    post:
      operationId: createProof
      tags: [proofs]
      summary: Register an uploaded proof file for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProofInput"
      responses:
        "201":
          description: Created proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofDetail"

  /proofs/{proofId}:
    get:
      operationId: getProof
      tags: [proofs]
      summary: Get a proof with annotations, comments, and decisions
      parameters:
        - name: proofId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proof detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /proofs/{proofId}/annotations:
    post:
      operationId: createAnnotation
      tags: [proofs]
      summary: Add a markup annotation to a proof
      parameters:
        - name: proofId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnotationInput"
      responses:
        "201":
          description: Created annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofAnnotation"

  /annotations/{annotationId}:
    patch:
      operationId: updateAnnotation
      tags: [proofs]
      summary: Update an annotation (e.g. resolve)
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnotationInput"
      responses:
        "200":
          description: Updated annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofAnnotation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAnnotation
      tags: [proofs]
      summary: Delete an annotation
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /proofs/{proofId}/comments:
    post:
      operationId: createComment
      tags: [proofs]
      summary: Add a comment to a proof or annotation thread
      parameters:
        - name: proofId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofComment"

  /proofs/{proofId}/decision:
    post:
      operationId: recordProofDecision
      tags: [proofs]
      summary: Record an approval decision on a proof
      parameters:
        - name: proofId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProofDecisionInput"
      responses:
        "200":
          description: Updated proof detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofDetail"

  /packages/{id}:
    get:
      operationId: getPackage
      tags: [packages]
      summary: Get a package with full compliance intelligence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updatePackage
      tags: [packages]
      summary: Update package status or workflow state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageUpdate"
      responses:
        "200":
          description: Updated package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePackage
      tags: [packages]
      summary: Delete a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/analyze:
    post:
      operationId: analyzePackage
      tags: [packages]
      summary: Run (or re-run) the AI compliance analysis pipeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analyzed package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/copilot:
    post:
      operationId: askCopilot
      tags: [packages]
      summary: Ask the AI compliance copilot a question about this package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotInput"
      responses:
        "200":
          description: Copilot answer with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotAnswer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/{id}/audit:
    get:
      operationId: getPackageAudit
      tags: [packages]
      summary: Review history for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

  /packages/{id}/report:
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a compliance report for a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /packages/bulk-analyze:
    post:
      operationId: bulkAnalyze
      tags: [packages]
      summary: Run compliance analysis across many packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAnalyzeInput"
      responses:
        "200":
          description: Bulk analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAnalyzeResult"

  /fda/recalls:
    get:
      operationId: listFdaRecalls
      tags: [regulations]
      summary: Search live FDA recall & enforcement actions (openFDA)
      parameters:
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [food, drug, device]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Matching FDA recalls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FdaRecallResponse"

  /fda/status:
    get:
      operationId: getFdaStatus
      tags: [regulations]
      summary: FDA integration status & category-to-source catalog (admin)
      responses:
        "200":
          description: FDA integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FdaStatus"

  /fda/intelligence:
    get:
      operationId: getFdaIntelligence
      tags: [regulations]
      summary: Assemble applicable FDA regulatory intelligence for a package
      parameters:
        - name: packageId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: FDA intelligence for the package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FdaIntelligence"

  /regulations:
    get:
      operationId: listRegulations
      tags: [regulations]
      summary: Browse the regulatory knowledge base
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: agency
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of regulations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Regulation"
    post:
      operationId: createRegulation
      tags: [regulations]
      summary: Add a regulation to the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegulationInput"
      responses:
        "201":
          description: Created regulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Regulation"

  /regulations/{id}:
    get:
      operationId: getRegulation
      tags: [regulations]
      summary: Get a single regulation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Regulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Regulation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers and vendors
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Add a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a supplier with its packages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Global audit history feed
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Notification center feed
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated compliance reports
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /me:
    get:
      operationId: getMe
      tags: [admin]
      summary: Current user identity, organization, role, and permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List platform users and their roles
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"

  /ai-providers:
    get:
      operationId: listAiProviders
      tags: [ai]
      summary: List configured AI model providers
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
    post:
      operationId: createAiProvider
      tags: [ai]
      summary: Add an AI model provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderInput"
      responses:
        "201":
          description: Created provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"

  /ai-providers/{id}:
    patch:
      operationId: updateAiProvider
      tags: [ai]
      summary: Update an AI model provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAiProvider
      tags: [ai]
      summary: Remove an AI model provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /ai-providers/{id}/activate:
    post:
      operationId: activateAiProvider
      tags: [ai]
      summary: Make this provider the active analysis engine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /ai-providers/{id}/test:
    post:
      operationId: testAiProvider
      tags: [ai]
      summary: Test connectivity to an AI model provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderTestResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    FdaRecall:
      type: object
      required:
        [
          recallNumber,
          category,
          status,
          classification,
          productDescription,
          reason,
          recallingFirm,
          distributionPattern,
          location,
        ]
      properties:
        recallNumber:
          type: string
        category:
          type: string
        status:
          type: string
        classification:
          type: string
        productDescription:
          type: string
        reason:
          type: string
        recallingFirm:
          type: string
        distributionPattern:
          type: string
        location:
          type: string
        initiationDate:
          type: string
          nullable: true
        reportDate:
          type: string
          nullable: true

    FdaRecallResponse:
      type: object
      required: [results, total, disclaimer]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/FdaRecall"
