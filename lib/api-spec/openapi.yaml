      summary: Get a single policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updatePolicy
      tags: [policies]
      summary: Update or archive a policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdate"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /policies/{id}/versions:
    get:
      operationId: listPolicyVersions
      tags: [policies]
      summary: List immutable version snapshots of a policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyVersion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createPolicyVersion
      tags: [policies]
      summary: Publish a new version of a policy (snapshots the current state)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyVersionInput"
      responses:
        "200":
          description: Updated policy at the new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /policies/{id}/reprocess:
    post:
      operationId: reprocessPolicy
      tags: [policies]
      summary: Re-extract the policy document text and re-embed the policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reprocessed policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /resources/overview:
    get:
      operationId: getResourceOverview
      tags: [resources]
      summary: Aggregate counts for every reference resource type in the Resource Center
      responses:
        "200":
          description: Resource Center overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceOverview"

  /resources/search:
    get:
      operationId: searchResources
      tags: [resources]
      summary: Unified search across every compliance reference resource
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: Comma-separated list of resource types to include.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Ranked matching resources across all types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceSearchResponse"

